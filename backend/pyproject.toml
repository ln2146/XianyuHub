[project]
name = "xianyuhub"
version = "0.1.0"
description = "鱼塘管家：闲鱼买卖双端智能助手"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "websockets>=12.0",
  "msgpack>=1.0.8",
  "cryptography>=42",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "loguru>=0.7",
  "apscheduler>=3.10,<4",
  "redis>=5.0",
  "croniter>=2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501", "ASYNC109"]
